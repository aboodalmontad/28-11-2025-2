<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مكتب المحامي</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1f2937" />
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap");
      body {
        font-family: "Tajawal", sans-serif;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }

      /* Initial Loader Styles */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f3f4f6;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e5e7eb;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      #loader-error {
        display: none;
        margin-top: 20px;
        text-align: center;
        color: #dc2626;
        max-width: 80%;
        padding: 1rem;
        background: white;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-gray-100">
    <div id="initial-loader">
      <div class="spinner"></div>
      <div id="loader-error">
        <p class="font-bold mb-2">تعذر تشغيل التطبيق بسرعة.</p>
        <p class="text-sm text-gray-600 mb-4">
          قد يكون هناك مشكلة في الاتصال أو الذاكرة المحلية.
        </p>
        <button
          onclick="window.location.reload()"
          class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold shadow-md hover:bg-blue-700"
        >
          تحديث الصفحة
        </button>
      </div>
    </div>
    <!-- The root element for React -->
    <div id="root"></div>
    <div id="datepicker-portal"></div>
    <!-- Script to handle loader removal if React fails or takes too long -->
    <script>
      // Safety watchdog: If app hasn't mounted in 10 seconds, show error.
      setTimeout(() => {
        const root = document.getElementById("root");
        const loader = document.getElementById("initial-loader");
        if (
          loader &&
          loader.style.display !== "none" &&
          (!root || root.innerHTML === "")
        ) {
          document.querySelector(".spinner").style.display = "none";
          document.getElementById("loader-error").style.display = "block";
        }
      }, 10000);
    </script>
    <!-- The main script for the application -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
